<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Factory Config UI</title>
  <style>
    body{
      font-family: "Microsoft JhengHei", sans-serif;
      padding: 30px;
      line-height: 1.6;
      background: #ffffff;
    }
    h1{
      font-size: 48px;
      margin-bottom: 16px;
    }
    h2{
      font-size: 28px;
      margin: 10px 0;
    }
    .panel{
      border: 1px solid #cfcfcf;
      padding: 20px;
      border-radius: 12px;
      max-width: 1100px;
      background: #fff;
      margin-bottom: 30px;
    }
    .row{
      display: grid;
      grid-template-columns: 2fr 1fr 3fr 0.7fr;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
    }
    input, select{
      padding: 12px;
      font-size: 18px;
      border: 1px solid #777;
      border-radius: 6px;
    }
    button{
      padding: 12px 18px;
      font-size: 18px;
      border-radius: 8px;
      border: 1px solid #555;
      background: #f5f5f5;
      cursor: pointer;
    }
    button:hover{
      background: #eaeaea;
    }
    .speeds{
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .small{
      width: 90px;
    }
    hr{
      margin: 35px 0;
    }
    .productCard{
      border: 1px solid #ddd;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 16px;
      background: #fafafa;
    }
    .productHeader{
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
    }
    .stepRow{
      display: grid;
      grid-template-columns: 2fr 1fr 0.7fr;
      gap: 10px;
      margin-bottom: 10px;
      align-items: center;
    }
    .hint{
      font-size: 14px;
      color: #666;
      margin-top: 6px;
    }
  </style>
</head>

<body>

  <h1>1) 機台設定（type + 台數 + speed）</h1>
  <div class="panel">
    <div id="machineTypeList"></div>

    <button type="button" id="addMachineTypeBtn">+ 新增機台種類</button>
    <div class="hint">📌 台數改變會自動增減 speed 欄位。name 會在 Python 端自動生成 type_1、type_2…</div>
  </div>

  <hr>

  <h1>2) 工件設定（Products + Route）</h1>
  <div class="panel">
    <div id="productList"></div>

    <button type="button" id="addProductBtn">+ 新增工件</button>
    <div class="hint">📌 route 的 type 會自動從上面的 type 清單生成下拉選單。</div>
  </div>

  <button type="button" id="downloadBtn" style="font-size:22px; padding:14px 26px;">⬇ 下載 config.json</button>

<script>
/* =========================================
   0) 初始資料（你可自己改）
========================================= */
let machineTypes = [
  { type: "前處理", count: 2, speeds: [1.0, 1.0] },
  { type: "加工",   count: 2, speeds: [1.0, 1.5] },
  { type: "品檢",   count: 1, speeds: [2.0] }
];

let products = [
  {
    name: "工件A",
    quantity: 5,
    route: [
      { type: "前處理", duration: 2.0 },
      { type: "加工", duration: 4.0 },
      { type: "品檢", duration: 2.0 }
    ]
  }
];

/* =========================================
   1) 工具函式
========================================= */
function getTypeOptions(){
  return machineTypes
    .map(mt => (mt.type || "").trim())
    .filter(t => t.length > 0);
}

/* =========================================
   2) Machine Types UI
========================================= */
function renderMachineTypes(){
  const list = document.getElementById("machineTypeList");
  list.innerHTML = "";

  machineTypes.forEach((mt, idx) => {
    const row = document.createElement("div");
    row.className = "row";

    // type input
    const typeInput = document.createElement("input");
    typeInput.value = mt.type;
    typeInput.placeholder = "輸入 type（例如：加工）";
    typeInput.oninput = () => {
      mt.type = typeInput.value;
      updateAllRouteDropdowns();
    };

    // count input
    const countInput = document.createElement("input");
    countInput.type = "number";
    countInput.min = "1";
    countInput.value = mt.count;
    countInput.oninput = () => {
      let newCount = parseInt(countInput.value);
      if (isNaN(newCount) || newCount < 1) newCount = 1;
      mt.count = newCount;

      // speeds array resize
      while (mt.speeds.length < newCount) mt.speeds.push(1.0);
      while (mt.speeds.length > newCount) mt.speeds.pop();

      renderMachineTypes();
      updateAllRouteDropdowns();
    };

    // speeds inputs
    const speedsDiv = document.createElement("div");
    speedsDiv.className = "speeds";

    mt.speeds.forEach((sp, i) => {
      const spInput = document.createElement("input");
      spInput.type = "number";
      spInput.step = "0.1";
      spInput.value = sp;
      spInput.className = "small";
      spInput.title = `${mt.type || "type"}_${i+1} speed`;

      spInput.oninput = () => {
        mt.speeds[i] = parseFloat(spInput.value);
      };

      speedsDiv.appendChild(spInput);
    });

    // delete btn
    const delBtn = document.createElement("button");
    delBtn.textContent = "刪除";
    delBtn.onclick = () => {
      machineTypes.splice(idx, 1);
      renderMachineTypes();
      updateAllRouteDropdowns();
    };

    row.appendChild(typeInput);
    row.appendChild(countInput);
    row.appendChild(speedsDiv);
    row.appendChild(delBtn);

    list.appendChild(row);
  });
}

document.getElementById("addMachineTypeBtn").onclick = () => {
  machineTypes.push({ type: "新機台", count: 1, speeds: [1.0] });
  renderMachineTypes();
  updateAllRouteDropdowns();
};

/* =========================================
   3) Products + Route UI
========================================= */
function renderProducts(){
  const list = document.getElementById("productList");
  list.innerHTML = "";

  const typeOptions = getTypeOptions();

  products.forEach((p, pIdx) => {
    const card = document.createElement("div");
    card.className = "productCard";

    // header
    const header = document.createElement("div");
    header.className = "productHeader";

    const nameInput = document.createElement("input");
    nameInput.value = p.name;
    nameInput.placeholder = "工件名稱";
    nameInput.oninput = () => p.name = nameInput.value;

    const qtyInput = document.createElement("input");
    qtyInput.type = "number";
    qtyInput.min = "1";
    qtyInput.value = p.quantity;
    qtyInput.oninput = () => p.quantity = parseInt(qtyInput.value) || 1;

    header.appendChild(nameInput);
    header.appendChild(qtyInput);

    // route steps
    const routeDiv = document.createElement("div");

    p.route.forEach((step, sIdx) => {
      const stepRow = document.createElement("div");
      stepRow.className = "stepRow";

      // type select
      const sel = document.createElement("select");
      typeOptions.forEach(t => {
        const opt = document.createElement("option");
        opt.value = t;
        opt.textContent = t;
        sel.appendChild(opt);
      });

      // 如果原本 step.type 被刪掉了 → fallback
      if (!typeOptions.includes(step.type)) {
        step.type = typeOptions[0] || "";
      }
      sel.value = step.type;
      sel.onchange = () => step.type = sel.value;

      // duration
      const durInput = document.createElement("input");
      durInput.type = "number";
      durInput.step = "0.5";
      durInput.value = step.duration;
      durInput.oninput = () => step.duration = parseFloat(durInput.value);

      // delete step
      const delStepBtn = document.createElement("button");
      delStepBtn.textContent = "刪除";
      delStepBtn.onclick = () => {
        p.route.splice(sIdx, 1);
        renderProducts();
      };

      stepRow.appendChild(sel);
      stepRow.appendChild(durInput);
      stepRow.appendChild(delStepBtn);

      routeDiv.appendChild(stepRow);
    });

    // add step
    const addStepBtn = document.createElement("button");
    addStepBtn.textContent = "+ 新增路徑步驟";
    addStepBtn.onclick = () => {
      const options = getTypeOptions();
      p.route.push({
        type: options[0] || "",
        duration: 2.0
      });
      renderProducts();
    };

    // delete product
    const delProductBtn = document.createElement("button");
    delProductBtn.textContent = "刪除此工件";
    delProductBtn.style.marginLeft = "12px";
    delProductBtn.onclick = () => {
      products.splice(pIdx, 1);
      renderProducts();
    };

    card.appendChild(header);
    card.appendChild(routeDiv);
    card.appendChild(addStepBtn);
    card.appendChild(delProductBtn);

    list.appendChild(card);
  });
}

document.getElementById("addProductBtn").onclick = () => {
  const typeOptions = getTypeOptions();
  products.push({
    name: "新工件",
    quantity: 1,
    route: [{ type: typeOptions[0] || "", duration: 2.0 }]
  });
  renderProducts();
};

function updateAllRouteDropdowns(){
  // 最簡單安全：整個重新 render
  renderProducts();
}

/* =========================================
   4) Download JSON
========================================= */
document.getElementById("downloadBtn").onclick = () => {
  const cfg = {
    machine_types: machineTypes.map(mt => ({
      type: (mt.type || "").trim(),
      count: parseInt(mt.count) || 1,
      speeds: mt.speeds.map(s => parseFloat(s))
    })),
    products: products
  };

  const blob = new Blob([JSON.stringify(cfg, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "config.json";
  a.click();

  URL.revokeObjectURL(url);
};

/* =========================================
   Init
========================================= */
renderMachineTypes();
renderProducts();

</script>
</body>
</html>
